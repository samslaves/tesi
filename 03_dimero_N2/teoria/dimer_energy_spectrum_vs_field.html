<div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:8px;font-size:12px;color:var(--color-text-secondary)">
  <span style="display:flex;align-items:center;gap:5px"><span style="width:16px;height:0;border-top:2px solid #D85A30"></span>|↑↑⟩, M=+1</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:16px;height:0;border-top:2px dashed #BA7517"></span>tripletto M=0</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:16px;height:0;border-top:2px solid #378ADD"></span>|↓↓⟩, M=−1</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:16px;height:0;border-top:2px dotted #7F77DD"></span>singoletto S=0</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:16px;height:5px;background:#9FE1CB;border-radius:2px"></span>stato fondamentale</span>
</div>
<div style="position:relative;width:100%;height:360px">
<canvas id="spec" role="img" aria-label="Diagramma dei livelli energetici del dimero di spin in funzione del campo B su J. Il singoletto è costante a meno tre J, i tre stati di tripletto partono da più J e si separano linearmente: M uguale a più uno sale, M uguale a zero resta costante, M uguale a meno uno scende. Lo stato fondamentale è il singoletto fino a B su J uguale a due, poi diventa lo stato M uguale a meno uno.">Spettro: singoletto a -3J costante; tripletto da +J che si separa; incrocio del fondamentale a B/J=2.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('spec'),{
 type:'line',
 data:{datasets:[
  {label:'GS',data:[{x:0,y:-3},{x:2,y:-3},{x:6,y:-11}],borderColor:'#9FE1CB',backgroundColor:'transparent',borderWidth:9,pointRadius:0,tension:0,order:5},
  {label:'M=+1',data:[{x:0,y:1},{x:6,y:13}],borderColor:'#D85A30',borderWidth:2,pointRadius:0,order:1},
  {label:'M=0',data:[{x:0,y:1},{x:6,y:1}],borderColor:'#BA7517',borderWidth:2,borderDash:[7,4],pointRadius:0,order:2},
  {label:'M=-1',data:[{x:0,y:1},{x:6,y:-11}],borderColor:'#378ADD',borderWidth:2,pointRadius:0,order:3},
  {label:'S=0',data:[{x:0,y:-3},{x:6,y:-3}],borderColor:'#7F77DD',borderWidth:2,borderDash:[2,3],pointRadius:0,order:4},
  {label:'crossing',data:[{x:2,y:-3}],borderColor:'#0F6E56',backgroundColor:'#0F6E56',pointRadius:5,pointStyle:'circle',showLine:false,order:0}
 ]},
 options:{responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{enabled:false}},
  scales:{
   x:{type:'linear',min:0,max:6,title:{display:true,text:'B / J'},grid:{color:'rgba(128,128,128,0.12)'}},
   y:{min:-12,max:14,title:{display:true,text:'E / J'},grid:{color:'rgba(128,128,128,0.12)'}}
  }}
});
</script>
