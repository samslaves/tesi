  <desc id="dd" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Due ioni magnetici localizzati, ciascuno con un elettrone spaiato (spin su e spin giù, antiparalleli), collegati da un ponte diamagnetico. Un arco tratteggiato in alto indica l'hopping virtuale t attraverso il ponte. In basso, lo scambio effettivo J uguale a quattro t quadro su U.</desc>
