<style>
  @keyframes phaseA{0%,20%{opacity:1}32%,68%{opacity:0}80%,100%{opacity:1}}
  @keyframes phaseB{0%,20%{opacity:0}32%,68%{opacity:1}80%,100%{opacity:0}}
  @keyframes arcpulse{0%,100%{opacity:.22}50%{opacity:.6}}
  @media (prefers-reduced-motion: no-preference){
    #dimerSvg:not(.para) .g1up,#dimerSvg:not(.para) .g2down{animation:phaseA 2.6s ease-in-out infinite}
    #dimerSvg:not(.para) .g1down,#dimerSvg:not(.para) .g2up{animation:phaseB 2.6s ease-in-out infinite}
    #dimerSvg:not(.para) .arc{animation:arcpulse 2.6s ease-in-out infinite}
  }
  #dimerSvg.para .g1up,#dimerSvg.para .g2up{opacity:1!important;animation:none!important}
  #dimerSvg.para .g1down,#dimerSvg.para .g2down{opacity:0!important;animation:none!important}
  #dimerSvg.para .arc{opacity:0!important}
  .modebtn{font:inherit;padding:7px 14px;border:0.5px solid var(--color-border-secondary);background:transparent;border-radius:var(--border-radius-md);cursor:pointer;color:var(--color-text-primary)}
  .modebtn[aria-pressed="true"]{border:2px solid var(--color-border-info);color:var(--color-text-info)}
</style>
<svg id="dimerSvg" width="100%" viewBox="0 0 680 270" role="img" aria-labelledby="t d">
  <title id="t">Animazione del termine di scambio in un dimero di spin</title>
  <desc id="d">Due siti accoppiati. In modalità antiparallela le due frecce di spin si scambiano periodicamente (su giù diventa giù su) per effetto del termine flip-flop. In modalità parallela entrambe restano su e non c'è dinamica.</desc>

  <path class="arc" d="M282 135 Q340 100 398 135" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5"/>
  <polygon class="arc" points="275,131 286,131 280,142" fill="var(--color-text-tertiary)"/>
  <polygon class="arc" points="394,131 405,131 400,142" fill="var(--color-text-tertiary)"/>

  <line x1="282" y1="175" x2="398" y2="175" stroke="var(--color-border-primary)" stroke-width="2"/>
  <text x="340" y="166" text-anchor="middle" style="font-size:15px;font-style:italic;fill:var(--color-text-secondary)">J</text>

  <circle cx="240" cy="175" r="42" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <circle cx="440" cy="175" r="42" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>

  <g class="g1up" opacity="1">
    <line x1="240" y1="199" x2="240" y2="159" stroke="#D85A30" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="232,162 248,162 240,149" fill="#D85A30"/>
  </g>
  <g class="g1down" opacity="0">
    <line x1="240" y1="151" x2="240" y2="191" stroke="#378ADD" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="232,188 248,188 240,201" fill="#378ADD"/>
  </g>
  <g class="g2up" opacity="0">
    <line x1="440" y1="199" x2="440" y2="159" stroke="#D85A30" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="432,162 448,162 440,149" fill="#D85A30"/>
  </g>
  <g class="g2down" opacity="1">
    <line x1="440" y1="151" x2="440" y2="191" stroke="#378ADD" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="432,188 448,188 440,201" fill="#378ADD"/>
  </g>

  <text x="240" y="248" text-anchor="middle" style="font-size:13px;fill:var(--color-text-secondary)">spin 1</text>
  <text x="440" y="248" text-anchor="middle" style="font-size:13px;fill:var(--color-text-secondary)">spin 2</text>
</svg>
<div style="display:flex;gap:10px;margin-top:6px">
  <button class="modebtn" id="btn-anti" aria-pressed="true" onclick="setMode('anti')">Antiparallelo</button>
  <button class="modebtn" id="btn-para" aria-pressed="false" onclick="setMode('para')">Parallelo</button>
</div>
<p id="status" style="margin:10px 0 0;font-size:13px;color:var(--color-text-secondary)">Flip-flop attivo: il termine X₁X₂+Y₁Y₂ scambia i due spin, |↑↓⟩ ⇄ |↓↑⟩.</p>
<script>
function setMode(m){
  var svg=document.getElementById('dimerSvg');
  var anti=(m==='anti');
  svg.classList.toggle('para',!anti);
  document.getElementById('btn-anti').setAttribute('aria-pressed',anti);
  document.getElementById('btn-para').setAttribute('aria-pressed',!anti);
  document.getElementById('status').textContent=anti
    ? 'Flip-flop attivo: il termine X₁X₂+Y₁Y₂ scambia i due spin, |↑↓⟩ ⇄ |↓↑⟩.'
    : 'Nessuna dinamica: |↑↑⟩ è autostato, il flip-flop dà zero (resta diagonale).';
}
</script>
